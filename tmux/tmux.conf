# Prefix: default Ctrl-b (do not override)

# Intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Mouse support (resize panes, click to focus)
set -g mouse on

# Start windows and panes at 1 (easier keyboard reach)
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback buffer
set -g history-limit 50000

# Status bar
set -g status-right "%Y-%m-%d %H:%M"
set -g status-left-length 20

# --- Window list ---
# Give some breathing room between windows in the list
set -g window-status-separator "  "

# Each window shows: index : name if renamed, else current dir basename
# (truncated to 15 chars)
# e.g.  2:dotfiles
set -g window-status-format         " #I:#{=15:#{?automatic-rename,#{b:pane_current_path},#W}} "
set -g window-status-current-format " #I:#{=15:#{?automatic-rename,#{b:pane_current_path},#W}} "

# Overall status bar: use the terminal's own background (no green block)
set -g status-style                 "fg=colour245,bg=default"
# Inactive windows: muted grey. Current window: bright green + bold (no inverse block).
set -g window-status-style          "fg=colour245,bg=default"
set -g window-status-current-style  "fg=green,bold,bg=default"
# Windows with activity/bell get a subtle emphasis
set -g window-status-activity-style "fg=yellow,bg=default"

# Don't rename windows automatically
set-option -g allow-rename off


# Modern terminal colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Make a new window into four quadrants
bind Q split-window -h \; split-window -v \; select-pane -t 1 \; split-window -v \; select-pane -t 1
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save sessions every 15 minutes; restore them when the tmux server starts
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize plugin manager (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'

# This machine's own settings, if any. Last, so they win.
source-file -q ~/.config/tmux/local.conf
