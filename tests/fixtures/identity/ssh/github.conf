# Test data: fictional SSH aliases for the identity suites.
#
# One key per alias, and IdentitiesOnly, so an alias whose key is absent on a machine is
# refused rather than tried with some other key.

# UseKeychain is macOS-only; without this Linux rejects the file.
IgnoreUnknown UseKeychain

# Plain github.com: unrouted owners and public clones.
Host github.com
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_alice
    IdentitiesOnly yes
    AddKeysToAgent yes
    UseKeychain yes

# alice/* and acme/* (an organization alice belongs to).
Host github-alice
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_alice
    IdentitiesOnly yes
    AddKeysToAgent yes
    UseKeychain yes

Host github-bob
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_bob
    IdentitiesOnly yes
    AddKeysToAgent yes
    UseKeychain yes

Host github-carol
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_carol
    IdentitiesOnly yes
    AddKeysToAgent yes
    UseKeychain yes
