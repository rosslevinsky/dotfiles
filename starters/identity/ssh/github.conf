# The SSH aliases: one key per alias, so each GitHub account is reached with its own key.
#
# To fill in: remove `#> ` from the suggested lines below and change alice to your account.
# Copy the second block for each further alias in the owners file. If you have no key yet,
# make one with `ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519_alice`. Add this line to
# ~/.ssh/config, before its first Host or Match line:
#   Include config.d/github.conf
#
# To check: run `setup.sh --git-identity`, then `~/.local/bin/git-identity-check --live`.
#
# UseKeychain is macOS-only; this line stops other systems rejecting the file.
#> IgnoreUnknown UseKeychain
#>
# Plain github.com: repos no owner line covers, and public clones.
#> Host github.com
#>     HostName github.com
#>     User git
#>     IdentityFile ~/.ssh/id_ed25519_alice
#>     IdentitiesOnly yes
#>     AddKeysToAgent yes
#>     UseKeychain yes
#>
# One owner's repos.
#> Host github-alice
#>     HostName github.com
#>     User git
#>     IdentityFile ~/.ssh/id_ed25519_alice
#>     IdentitiesOnly yes
#>     AddKeysToAgent yes
#>     UseKeychain yes
